<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panjar PSO Per Cabang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--panel:#ffffff;--soft:#f6f7fa;--fg:#14161a;--muted:#6b7280;--line:#e3e6ec;--accent:#2563eb;--accent-soft:#eef2fb;--accent-line:#d5def2;--c1:#2563eb;--c2:#f59e0b;--warn:#fff3d6;--bad:#b3261e;--radius:8px;--serif:'Fraunces','Playfair Display',Georgia,'Times New Roman',serif;--sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#15171b;--panel:#1d2025;--soft:#1a1d21;--fg:#eceef2;--muted:#9aa1ad;--line:#2f343c;--accent:#5b8def;--accent-soft:#232b3d;--accent-line:#33405e;--c1:#6aa0ff;--c2:#f0b04a;--warn:#4a3a1d;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--sans)}
.page{max-width:1500px;margin:0 auto;padding:clamp(12px,3vw,32px)}
h1,h2{font-family:var(--serif);font-weight:400;margin:0}
h1{font-size:28px} h2{font-size:24px} h3{font-size:16px;font-weight:600;margin:0 0 2px}
p{margin:0}
.muted{color:var(--muted);font-size:13px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select,input[type=search]{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:6px 10px}
button{cursor:pointer} button:disabled{opacity:.4;cursor:default}
label.file{display:inline-block;cursor:pointer;border:1px solid var(--line);border-radius:var(--radius);padding:6px 10px;background:var(--panel)}
label.file input{display:none}
#src{display:block;margin-top:6px}
.tabs{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--line);margin:14px 0}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;color:var(--muted);padding:8px 14px;margin-bottom:-1px}
.tabs button:hover{color:var(--fg)}
.tabs button.on{color:var(--fg);font-weight:600;border-bottom-color:var(--fg)}
.tabs.sub button{padding:6px 12px;font-size:13px}
.cabhead{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
.take{font-size:17px;line-height:1.5;margin:4px 0 14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,14rem),1fr));gap:12px;margin-bottom:12px}
.kpi{display:flex;flex-direction:column;gap:4px}
.lab,.note{color:var(--muted);font-size:13px}
.big{font-family:var(--serif);font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2;overflow-wrap:anywhere}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,26rem),1fr));gap:12px}
.grid .wide{grid-column:1/-1}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0 8px}
.bar input[type=search]{flex:1 1 16rem;min-width:0}
.scroll{max-height:70vh;overflow:auto;margin-top:8px;border:1px solid var(--line);border-radius:var(--radius)}
.tbl{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{position:sticky;top:0;z-index:1;background:var(--panel);text-align:left;font-weight:600;white-space:nowrap;padding:6px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:5px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
.tbl td.num{text-align:right} .tbl td.wrap{white-space:normal;min-width:18rem}
.tbl tr.warn td{background:var(--warn)}
.tbl tr.gt td{font-weight:600;border-top:1px solid var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0;font-size:13px;color:var(--muted)}
.legend i,.tip i{display:inline-block;width:.7rem;height:.7rem;border-radius:2px;margin-right:5px}
.chart{position:relative;min-height:260px;margin-top:6px} .chart.short{min-height:180px}
.chart svg{display:block}
.chart text{font-size:11px;fill:var(--muted);font-family:var(--sans)}
.chart .grid{stroke:var(--line)} .chart .rule{stroke:var(--muted)}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 4px 14px rgba(0,0,0,.18);padding:4px 8px;font-size:13px;white-space:nowrap;z-index:3}
.tip .t1{color:var(--muted)}

.ftabs{display:block;margin:0 0 4px}
.ftabs .tabs{display:flex;flex-wrap:wrap;gap:10px;border-bottom:1px solid var(--line);margin:0;padding:0 4px}
.ftabs .tabs button{background:var(--soft);border:1px solid var(--line);border-bottom:0;border-top:3px solid transparent;border-radius:10px 10px 0 0;color:var(--muted);font-weight:600;font-size:16px;padding:13px 32px;margin-bottom:-1px}
.ftabs .tabs button:hover{color:var(--fg)}
.ftabs .tabs button.on{background:var(--panel);color:var(--fg);border-top-color:var(--accent);border-bottom:1px solid var(--panel)}
.head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;justify-content:space-between;margin:26px 8px 14px}
.head h1{font-family:var(--serif);font-weight:700;font-size:clamp(30px,4.2vw,46px);line-height:1.1;letter-spacing:-.01em}
.per{color:var(--muted);font-size:15px;margin-top:6px}
.head-r{display:flex;flex-direction:column;align-items:flex-end;gap:8px;min-width:0;text-align:right}
.syncrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:10px}
.sync{color:var(--muted);font-size:15px}
.sync b{color:var(--fg);font-weight:600}
.ico{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;font-size:17px;line-height:1;font-weight:700;flex:none}
.ico.off{background:var(--muted)}
.ico.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ico.spin{animation:none}}
.rbtn{display:inline-flex;align-items:center;gap:12px;background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:12px;padding:9px 24px 9px 12px;font-size:18px;font-weight:700;color:var(--fg)}
.rbtn:hover{border-color:var(--accent)}
.rbtn .ico{width:32px;height:32px;font-size:20px}
.srcrow{color:var(--muted);font-size:15px}
.srcrow .link{cursor:pointer;color:var(--accent);text-decoration:underline}
.srcrow input{display:none}
.rule{border:0;border-top:1px solid var(--line);margin:0 8px 14px}
#warn{display:block;margin:0 8px 8px}

.exp{position:relative}
.subrow{display:flex;align-items:flex-end;gap:12px;border-bottom:1px solid var(--line);margin:14px 0}
.subrow .tabs{border-bottom:0;margin:0;flex:1;min-width:0}
.subrow .expgrp{margin-left:auto;display:flex;gap:8px;padding-bottom:6px}
.subrow .xbtn{padding:7px 14px 7px 16px;font-size:14px;border-radius:10px}
.xbtn{padding:9px 16px 9px 20px;gap:8px}
.caret{font-size:14px;color:var(--muted)}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:20;min-width:260px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.16);padding:6px;text-align:left}
.menu[hidden]{display:none}
.menu .mh{font-size:12px;font-weight:600;color:var(--muted);padding:8px 10px 4px;text-transform:uppercase;letter-spacing:.04em}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:9px 10px;font-size:15px;color:var(--fg);cursor:pointer}
.menu button:hover{background:var(--accent-soft)}
#printArea{display:none}
@media print{
  @page{size:A4 landscape;margin:9mm}
  body.printing{background:#fff;color:#000}
  body.printing .page{display:none}
  body.printing #printArea{display:block;font-family:var(--sans)}
  #printArea h1{font-size:18px;margin:0 0 2px}
  #printArea h2{font-size:13px;margin:12px 0 4px}
  #printArea .pmeta{font-size:10px;color:#444;margin:0 0 6px}
  #printArea .pbreak{page-break-before:always}
  #printArea .scroll{max-height:none;overflow:visible;border:0;margin:0}
  #printArea .tbl{font-size:7px;width:100%;table-layout:auto;color:#000}
  #printArea .tbl th{position:static;background:#e8edf7;color:#000;white-space:normal;padding:2px 3px;border:1px solid #999}
  #printArea .tbl td{white-space:normal;word-break:break-word;padding:2px 3px;border:1px solid #ccc}
  #printArea .tbl thead{display:table-header-group}
  #printArea .tbl tr{page-break-inside:avoid}
  #printArea .tbl tr.tot td,#printArea .tbl tr.gt td{font-weight:700}
  #printArea .tbl tr.warn td{background:#fff3d6}
}

.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--accent-soft)}
.tbl tr.click:focus{outline:2px solid var(--accent);outline-offset:-2px}
.kpi.click{cursor:pointer;transition:border-color .15s}
.kpi.click:hover,.kpi.click:focus{border-color:var(--accent);outline:none}
.hint{font-size:12px;color:var(--accent);margin-top:2px}
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,12,16,.5);display:flex;align-items:center;justify-content:center;padding:3vh 3vw}
.modal[hidden]{display:none}
.mbox{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:14px;width:min(1180px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.mhead{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mhead{flex-wrap:wrap}
.mhead h3{flex:1;min-width:12rem;font-size:18px;margin:0;overflow-wrap:anywhere}
.mbtn{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:6px 12px;font-size:14px;color:var(--fg);cursor:pointer}
.mbtn.mx{font-size:22px;line-height:1;padding:2px 11px}
.mbody{padding:16px 18px;overflow:auto}
.mbody .scroll{max-height:52vh}
.mh3{font-size:15px;margin:16px 0 4px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:10px 18px}
.kvi{display:flex;flex-direction:column;gap:2px;min-width:0}
.kvv{font-weight:600;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
body.modal-open{overflow:hidden}
@media print{.modal{display:none!important}}

body.locked .page,body.locked #printArea{display:none}
.gate{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.gate[hidden]{display:none}
.gatebox{width:min(360px,100%);display:flex;flex-direction:column;gap:12px;text-align:center}
.gatebox h1{font-size:clamp(22px,6vw,28px)}
.gatebox input{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg);text-align:center}
.gobtn{justify-content:center;padding:10px 20px;font-size:15px}
.gateerr{color:var(--bad);min-height:1.2em;font-size:13px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.warn-text{color:var(--bad)}
input.cell,select.cell{font:inherit;font-size:12px;padding:3px 6px;min-width:0;width:9rem}
input.cell.wide{width:14rem} input.cell.numin{width:7.5rem;text-align:right}
.tbl td input.cell[type=date]{width:8.5rem}
.sum{margin-top:8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tbl tr.tot td{font-weight:600;border-top:1px solid var(--muted)}

/* ---- ukuran tulisan lebih kecil + tampilan HP ---- */
body{font-size:14px;line-height:1.45}
.page{padding:clamp(10px,2.4vw,24px)}
h1,h2{font-weight:700}
h2{font-size:clamp(18px,2.2vw,22px)}
h3{font-size:15px}
.muted{font-size:12.5px}
.head{margin:18px 6px 10px}
.head h1{font-size:clamp(22px,3vw,32px);line-height:1.15}
.per{font-size:13px;margin-top:4px}
.sync{font-size:13px}
.ico{width:24px;height:24px;border-radius:7px;font-size:15px}
.rbtn{font-size:14px;padding:6px 16px 6px 8px;gap:9px;border-radius:10px}
.rbtn .ico{width:26px;height:26px;font-size:16px}
.srcrow{font-size:13px}
.ftabs .tabs{gap:8px}
.ftabs .tabs button{font-size:14px;padding:9px 22px}
.tabs.sub button{font-size:13px;padding:7px 12px}
.take{font-size:15px;margin:2px 0 12px}
.card{padding:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(min(100%,12.5rem),1fr))}
.big{font-size:20px}
.lab,.note{font-size:12px}
.tbl{font-size:12px}
.tbl th{padding:5px 8px}
.tbl td{padding:4px 8px}
.bar input[type=search],.bar select,.bar button{font-size:13px;padding:5px 9px}
.xbtn{font-size:13px;padding:6px 12px 6px 14px}
.menu button{font-size:13.5px;padding:8px 10px}
.menu .mh{font-size:11px}
.mhead h3{font-size:16px}
.mbtn{font-size:13px;padding:5px 10px}
.kv{grid-template-columns:repeat(auto-fit,minmax(13rem,1fr))}
.tabs button{white-space:nowrap;flex:none}
@media (max-width:1000px){
  .tabs{overflow-x:auto;overflow-y:hidden;flex-wrap:nowrap!important;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
  .tabs button{margin-bottom:0}
}
.subrow{flex-wrap:wrap}
@media (max-width:760px){
  body{font-size:13.5px}
  .page{padding:8px}
  .head{flex-direction:column;align-items:stretch;gap:8px;margin:12px 2px 8px}
  .head h1{font-size:22px}
  .head-r{align-items:stretch;text-align:left;gap:4px}
  .syncrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}
  .sync{font-size:12px;line-height:1.35}
  .srcrow{font-size:12px}
  .rbtn{padding:5px 12px 5px 6px;font-size:13px;gap:6px}
  .rbtn .ico{width:22px;height:22px;font-size:14px}
  .ftabs .tabs{gap:5px;padding:0 2px}
  .ftabs .tabs button{font-size:13px;padding:8px 14px;border-radius:8px 8px 0 0}
  .rule{margin:0 2px 10px}
  #warn{margin:0 2px 6px}
  .cabhead h2{font-size:18px}
  .tabs.sub button{font-size:12.5px;padding:7px 10px}
  .subrow{gap:6px;margin:10px 0}
  .subrow .tabs{flex:1 1 100%}
  .subrow .expgrp{margin-left:0;width:100%;justify-content:flex-start;padding-bottom:2px}
  .subrow .expgrp .exp:first-child .menu{left:0;right:auto}
  .menu{min-width:210px;max-width:calc(100vw - 24px)}
  .xbtn{font-size:12.5px;padding:6px 10px}
  .card{padding:10px;border-radius:10px}
  .take{font-size:14px;line-height:1.45}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .kpi{padding:10px}
  .big{font-size:15px;line-height:1.25}
  .lab,.note{font-size:11.5px}
  .grid{grid-template-columns:minmax(0,1fr);gap:8px}
  .bar{gap:6px}
  .bar input[type=search]{flex:1 1 100%}
  .scroll{max-height:62vh}
  .tbl{font-size:11px}
  .tbl th,.tbl td{padding:4px 6px}
  .modal{padding:0;align-items:flex-end}
  .mbox{width:100%;max-height:94vh;border-radius:14px 14px 0 0}
  .mhead{padding:10px 12px;gap:8px}
  .mhead h3{font-size:14px;min-width:100%;order:-1}
  .mbody{padding:10px 12px}
  .mbody .scroll{max-height:46vh}
  .kv{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px}
  .kvv{font-size:13px}
}
</style>
</head>
<body class="locked">
<div id="gate" class="gate">
  <form id="gateForm" class="gatebox" autocomplete="off">
    <h1>Panjar PSO Per Cabang</h1>
    <p class="muted">Masukkan nama dan password untuk membuka dashboard.</p>
    <input type="text" id="gateName" placeholder="Nama" aria-label="Nama lengkap" autocomplete="off" autocapitalize="off" spellcheck="false" required autofocus>
    <input type="password" id="gateInput" placeholder="Password" aria-label="Password" autocomplete="off">
    <button type="submit" class="rbtn gobtn"><span>Masuk</span></button>
    <p id="gateErr" class="gateerr" aria-live="polite"></p>
  </form>
</div>
<div class="page">
  <div id="cabtabs" class="ftabs"></div>
  <div class="head">
    <div class="head-l">
      <h1>Panjar PSO Per Cabang</h1>
      <p class="per" id="per">Per : —</p>
    </div>
    <div class="head-r">
      <div class="syncrow">
        <span class="ico" id="syncIcon">↻</span>
        <span class="sync" id="syncText">Menyiapkan…</span>
        <button type="button" id="reload" class="rbtn"><span class="ico big">↻</span><span>Refresh</span></button>
      </div>
      <div class="srcrow" id="srcline">Sumber : PSO All Cabang</div>
    </div>
  </div>
  <hr class="rule">
  <span id="warn" class="muted warn-text"></span>
  <div id="root"></div>
</div>
<div id="modal" class="modal" hidden>
  <div class="mbox" role="dialog" aria-modal="true" aria-labelledby="mtitle">
    <div class="mhead"><button type="button" id="mback" class="mbtn" hidden>‹ Kembali</button><h3 id="mtitle"></h3><button type="button" id="mpdf" class="mbtn">Export PDF</button><button type="button" id="mxlsx" class="mbtn">Export Excel</button><button type="button" id="mclose" class="mbtn mx" aria-label="Tutup">×</button></div>
    <div class="mbody" id="mbody"></div>
  </div>

  const base = 'Panjar_PSO_' + what + '_' + stamp();

// ---------- password: asked every time the page is opened or reloaded (kept in memory only)
const h53 = (str) => { let h1 = 0xdeadbeef, h2 = 0x41c6ce57; for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); } h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909); h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909); return 4294967296 * (2097151 & h2) + (h1 >>> 0); };
const PASS_HASH = 2998845077603307;
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyLl7p16a1CSTj2prCGzKjUDxeIEyJsWwaCG_Nu2EEIFV2eoDlB7onRJ0KvMyPnNaAljw/exec';
const CABANG_NAME = 'Panjar PSO Per Cabang';
const NAMA_KATA_TERLARANG = ["panjar","pso","cabang","dashboard","perintis","perkasa","test","tes","admin","nama"];
function validName(v){
  v = (v || '').trim();
  if (!/^[A-Za-z.' -]+$/.test(v)) return false;
  const words = v.split(/\s+/).filter(Boolean);
  if (words.length < 2) return false;
  const lower = v.toLowerCase();
  for (let i = 0; i < NAMA_KATA_TERLARANG.length; i++){
    if (lower.indexOf(NAMA_KATA_TERLARANG[i]) >= 0) return false;
  }
  return true;
}
function _ambilPerangkat(){var ua=navigator.userAgent||'';var os='Tidak diketahui';if(/Windows/i.test(ua))os='Windows';else if(/Android/i.test(ua))os='Android';else if(/iPhone|iPad|iPod/i.test(ua))os='iOS';else if(/Macintosh|Mac OS/i.test(ua))os='Mac';else if(/Linux/i.test(ua))os='Linux';var br='Tidak diketahui';if(/Edg\//i.test(ua))br='Edge';else if(/OPR\//i.test(ua))br='Opera';else if(/Chrome\//i.test(ua)&&!/Chromium/i.test(ua))br='Chrome';else if(/Firefox\//i.test(ua))br='Firefox';else if(/Safari\//i.test(ua)&&!/Chrome/i.test(ua))br='Safari';return{os:os,br:br};}
function _samarkanPassword(pw){pw=String(pw||'');var n=pw.length;if(!n)return '';if(n<=4)return pw[0]+'*'.repeat(n-1);return pw.slice(0,2)+'*'.repeat(n-4)+pw.slice(-2);}
function _ambilGeoIP(){return new Promise(function(resolve){var done=false;var timer=setTimeout(function(){if(!done){done=true;resolve({});}},2500);fetch('https://ipapi.co/json/').then(function(r){return r.json();}).then(function(d){if(done)return;done=true;clearTimeout(timer);resolve({ip:d.ip||'-',negara:d.country_name||'-',kota:d.city||'-',lat:(d.latitude!=null?d.latitude:''),lng:(d.longitude!=null?d.longitude:'')});}).catch(function(){if(!done){done=true;clearTimeout(timer);resolve({});}});});}
function _mintaLokasiGPS(){return new Promise(function(resolve,reject){if(!navigator.geolocation){reject('nogeo');return;}navigator.geolocation.getCurrentPosition(function(pos){resolve({lat:pos.coords.latitude,lng:pos.coords.longitude});},function(err){reject(err);},{enableHighAccuracy:true,timeout:10000,maximumAge:60000});});}
function _isMobileDevice(){return /Android|iPhone|iPad|iPod|Mobile|Windows Phone|BlackBerry|webOS/i.test(navigator.userAgent||'');}
function _alamatDariKoordinat(lat,lng){return fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat='+lat+'&lon='+lng+'&zoom=18&addressdetails=1',{headers:{'Accept':'application/json'}}).then(function(r){return r.json();}).then(function(d){var a=d.address||{};return{alamat:d.display_name||'-',negara:a.country||'-',kota:a.city||a.town||a.village||a.county||a.regency||'-'};}).catch(function(){return{alamat:'-',negara:'-',kota:'-'};});}
function _getDeviceId(){try{var id=localStorage.getItem('pp_device_id');if(!id||id==='undefined'||id==='null'){id=Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)+'-'+Math.random().toString(36).slice(2);localStorage.setItem('pp_device_id',id);}return id;}catch(e){return 'no-storage-'+Date.now()+'-'+Math.random().toString(36).slice(2);}}
function _cekPerangkatSekali(nama,cabang,urlScript){return new Promise(function(resolve){var id=_getDeviceId();var cbName='_devcb_'+Date.now()+'_'+Math.floor(Math.random()*1e6);var done=false;var script=document.createElement('script');var timer=setTimeout(function(){if(!done){done=true;cleanup();resolve(null);}},9000);function cleanup(){clearTimeout(timer);try{delete window[cbName];}catch(e){window[cbName]=undefined;}if(script.parentNode)script.parentNode.removeChild(script);}window[cbName]=function(data){if(done)return;done=true;cleanup();resolve(data||null);};script.src=urlScript+'?action=cek&device='+encodeURIComponent(id)+'&nama='+encodeURIComponent(nama)+'&cabang='+encodeURIComponent(cabang)+'&callback='+cbName;script.onerror=function(){if(!done){done=true;cleanup();resolve(null);}};document.body.appendChild(script);});}
function _cekPerangkat(nama,cabang,urlScript){return _cekPerangkatSekali(nama,cabang,urlScript).then(function(r){if(r)return r;return _cekPerangkatSekali(nama,cabang,urlScript);}).then(function(r){if(r)return r;return _cekPerangkatSekali(nama,cabang,urlScript);}).then(function(r){return r||{status:'error'};});}
function sendLoginNotif(nama, cabang, pwTyped, loc){
  var _dev = _ambilPerangkat();
  _ambilGeoIP().then(function(geo){
    if(loc){geo.lat=loc.lat;geo.lng=loc.lng;if(loc.negara)geo.negara=loc.negara;if(loc.kota)geo.kota=loc.kota;}
    try {
      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ nama: nama, status: 'Berhasil', password: _samarkanPassword(pwTyped), cabang: cabang, link: location.href, akses: 'Akses Dashboard', perangkat: _dev.os, browser: _dev.br, ip: geo.ip||'-', negara: geo.negara||'-', kota: geo.kota||'-', lat: geo.lat||'', lng: geo.lng||'', alamat: (loc&&loc.alamat)||'-', waktu: new Date().toISOString() })
      });
    } catch (e) {}
  });
}
const gate = $('#gate'), gateForm = $('#gateForm'), gateName = $('#gateName'), gateInput = $('#gateInput'), gateErr = $('#gateErr');
gateForm.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  if (!gateName.value.trim()){ gateErr.textContent = 'Nama wajib diisi.'; gateName.focus(); return; }
  if (!validName(gateName.value)){ gateErr.textContent = 'Masukkan nama lengkap yang benar (minimal 2 kata).'; gateName.focus(); return; }
  if (h53(gateInput.value) !== PASS_HASH) { gateErr.textContent = 'Password salah. Coba lagi.'; gateInput.value = ''; gateInput.focus(); return; }
  const btn = gateForm.querySelector('button[type="submit"]');
  btn.disabled = true; gateErr.textContent = 'Memeriksa perangkat…';
  const namaTyped = gateName.value.trim(), pwTyped = gateInput.value;
  const _devChk = await _cekPerangkat(namaTyped, CABANG_NAME, APPS_SCRIPT_URL);
  if (_devChk.status !== 'approved') {
    gateErr.textContent = _devChk.status==='pending' ? 'Perangkat ini belum disetujui admin. Permintaan sudah dikirim, coba Masuk lagi setelah disetujui.' : (_devChk.status==='rejected' ? 'Perangkat ini ditolak admin.' : 'Tidak bisa menghubungi server. Coba lagi.');
    btn.disabled = false; return;
  }
  let _loc = null;
  if (_isMobileDevice()) {
    gateErr.textContent = 'Meminta izin lokasi…';
    try {
      const _gps = await _mintaLokasiGPS();
      const _geo = await _alamatDariKoordinat(_gps.lat, _gps.lng);
      _loc = {lat:_gps.lat, lng:_gps.lng, alamat:_geo.alamat, negara:_geo.negara, kota:_geo.kota};
    } catch (gpsErr) {
      gateErr.textContent = 'Izin lokasi diperlukan untuk login. Mohon izinkan akses lokasi, lalu coba lagi.';
      btn.disabled = false; return;
    }
  }
  sendLoginNotif(namaTyped, CABANG_NAME, pwTyped, _loc);
  gate.hidden = true; document.body.classList.remove('locked'); gateInput.value = ''; gateErr.textContent = ''; btn.disabled = false;
  start();
});

setTimeout(() => gateName.focus(), 50);
})();
