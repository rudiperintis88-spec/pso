.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:7px;padding:6px 12px;cursor:pointer}

.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.chk{white-space:nowrap;display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:13px}
.spacer{flex:1}
.tw{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:70vh}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1500px;font-size:12.5px}

td.typ{min-width:170px}

 td,th{padding:3px 5px}
}

  return DATA[state.tab].rows.filter(r=>{

function sortedRows(rows){
  const st=state[state.tab], {key,dir}=st.sort;
  const num = key==='age'||key==='no';
  const dateKey = ['mohon','terima','serah'].includes(key);
  const val = r => num? (r[key]===null||r[key]===''?-1:+r[key]) : dateKey? (pd(r[key])?.getTime()??0) : String(r[key]??'').toLowerCase();
  return rows.slice().sort((a,b)=>{ const x=val(a),y=val(b); return (x<y?-1:x>y?1:0)*dir; });
}
function cell(r,key,cls){

  if(key==='no') v=r._n;

  if(!rows.length) body=`<tr><td colspan="${cfg.cols.length}" class="empty">Tidak ada data yang sesuai filter</td></tr>`;
  else if(st.group){
    const g=new Map(); rows.forEach(r=>{(g.get(r.biro)||g.set(r.biro,[]).get(r.biro)).push(r);});
    for(const b of [...g.keys()].sort()){ const rs=sortedRows(g.get(b)); rs.forEach((r,i)=>r._n=i+1);

function exportRows(){

  const heads=cfg.cols.map(c=>c[1]); const data=rows.map(r=>cfg.cols.map(([k])=>{ const v=k==='no'?r._n:r[k]; return (v===null||v===undefined)?'':(k==='age'||k==='no')&&v!==''?+v:v; }));

  const {heads,data}=exportRows(); const stamp=TODAY.toISOString().slice(0,10); const name=`${TABS[state.tab].title.replace(/ /g,'_')}_Flamboyan_${stamp}`;
  const csvFallback=()=>{ const q=v=>`"${String(v).replace(/"/g,'""')}"`; const csv='﻿'+[heads,...data].map(r=>r.map(q).join(';')).join('\r\n'); downloadBlob(new Blob([csv],{type:'text/csv;charset=utf-8'}),name+'.csv'); };
  const go=()=>{ try{ const ws=XLSX.utils.aoa_to_sheet([heads,...data]); ws['!cols']=heads.map((h,i)=>({wch:Math.min(40,Math.max(h.length,...data.map(r=>String(r[i]).length))+2)})); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Flamboyan'); XLSX.writeFile(wb,name+'.xlsx'); }catch(e){ csvFallback(); } };
  if(window.XLSX) return go();
  const s=document.createElement('script'); s.src='https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js'; s.onload=go; s.onerror=csvFallback; document.head.appendChild(s);
}
function render(){
  renderTabs(); renderStamps();
  const rows=filtered(); renderTiles(rows); renderPanels(); renderFilters(); renderTable(rows);
}
document.addEventListener('click',e=>{
  const st=state[state.tab];
  const tb=e.target.closest('.tab'); if(tb){ state.tab=tb.id.replace('tab-',''); render(); return; }
  const row=e.target.closest('.row'); if(row){ const k=row.dataset.k, v=row.dataset.v; st.f[k]=st.f[k]===v?'':v; render(); return; }
  const th=e.target.closest('th[data-s]'); if(th){ const k=th.dataset.s; st.sort = st.sort.key===k? {key:k,dir:-st.sort.dir}:{key:k,dir:(k==='age'?-1:1)}; renderTable(filtered()); return; }
  if(e.target.id==='reset'){ st.f={q:'',biro:'',leasing:'',spv:'',ket:'',age:''}; render(); }
  if(e.target.id==='xls') exportExcel();
  if(e.target.id==='pdf') window.print();
});
document.addEventListener('change',e=>{
  const st=state[state.tab];
  if(e.target.dataset.f){ st.f[e.target.dataset.f]=e.target.value; render(); }
  if(e.target.id==='grp'){ st.group=e.target.checked; renderTable(filtered()); }
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){ const st=state[state.tab]; st.f.q=e.target.value; const pos=e.target.selectionStart; const rows=filtered(); renderTiles(rows); renderPanels(); renderTable(rows); }
});
render();
</script>
</body>
