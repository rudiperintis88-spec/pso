*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1560px;margin:0 auto;padding:34px 30px 50px}
/* header */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap;padding-bottom:22px;border-bottom:1px solid var(--line)}

.per{color:var(--muted);font-size:15px;margin-top:6px}

.live{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:14.5px;min-width:0;text-align:left}
.live b{color:var(--ink);font-weight:600}
.ico{width:30px;height:30px;border-radius:8px;background:var(--accent);display:inline-flex;align-items:center;justify-content:center;flex:none}

.live.warn .ico{background:#d97706}
.refresh{display:inline-flex;align-items:center;gap:11px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font:600 17px/1 system-ui,sans-serif;border-radius:14px;padding:11px 22px 11px 14px;cursor:pointer}
.refresh:hover{border-color:var(--accent)}
.refresh:disabled{opacity:.7;cursor:progress}
.spin svg{animation:rot .9s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.src{color:var(--ink2);font-size:15px}
/* tabs */
.tabs{display:flex;gap:28px;margin:22px 0 0;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;color:var(--muted);font:600 20px/1 var(--serif);padding:10px 2px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}

.cabtabs{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0 0}
.pill{border:1px solid var(--line);background:var(--card);color:var(--ink2);font:500 17px/1 system-ui,sans-serif;padding:15px 26px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:baseline;gap:10px}
.pill .n{color:var(--muted);font-size:17px}
.pill:hover{border-color:var(--ink2)}
.pill[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pill[aria-selected=true] .n{color:var(--bg);opacity:.85}

.hero{border:1px solid var(--line);border-radius:18px;padding:30px 32px;background:linear-gradient(135deg,var(--soft),var(--card));display:flex;flex-direction:column;justify-content:center;min-height:210px}
.hero .l{color:var(--ink2);font-size:17px}

.hero .s{color:var(--ink2);font-size:16px}

.row{display:grid;grid-template-columns:minmax(0,1fr) 38px;gap:6px;align-items:center;padding:3px 5px;border-radius:6px;cursor:pointer;border:0;background:none;width:100%;text-align:left;font:inherit;color:inherit}

.row .t{min-width:0}
.row .nm{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.row .bar{display:block;height:6px;border-radius:0 3px 3px 0;background:var(--bar);margin-top:2px;min-width:2px}
.row .c{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:12.5px}
/* filters */
.filters{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}

.spacer{flex:1}

function parseCSV(text){
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(cell); cell=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cell); cell=''; rows.push(row); row=[]; }
    else cell+=c; }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  return rows;
}
async function fetchSource(s){

      fetch(base+'&range=A4:A5&headers=0',{signal:ctl.signal,cache:'no-store'}).catch(()=>null)
    ]);
    if(!a.ok) throw new Error('HTTP '+a.status);
    const grid=parseCSV(await a.text());
    const hi=grid.findIndex((r,i)=>i<4 && (r[0]||'').trim()==='No');
    if(hi<0) throw new Error('header tidak ditemukan');
    const idx={}; grid[hi].forEach((h,i)=>idx[h.trim()]=i);

    const g=(r,n)=>idx[n]==null?'':(r[idx[n]]||'').trim();
    const rows=grid.slice(hi+1).map(r=>({no:g(r,'No'),nama:g(r,'STNK a/n'),type:g(r,'Type'),rangka:g(r,'NoRangka'),bast:g(r,'No. Bast'),polisi:g(r,'No Polisi').replace(/\s+/g,' '),
      mohon:nd(g(r,'Tgl Mohon STNK')),terima:nd(g(r,'Terima Tanggal STNK')),serah:nd(g(r,'Serah Tanggal STNK')),biro:g(r,'Biro Jasa'),leasing:g(r,'Leasing'),sales:g(r,'Salesman'),spv:g(r,'Supervisor'),ket:g(r,'Keterangan')}))

  $('src').textContent = `Sumber: ${cfg.sumber} ${srcs.map(s=>s.cab).join(', ')} (${n.toLocaleString('id-ID')} unit)`;
  const live=$('live'); const b=$('refresh');
  b.disabled=state.loading; b.classList.toggle('spin',state.loading);
  if(state.loading){ live.className='live'; live.innerHTML=`<span class="ico">${SVG_REFRESH}</span><span>Memuat data dari Google Sheet…</span>`; }
  else if(state.lastSync && !state.failed.length){ live.className='live'; live.innerHTML=`<span class="ico">${SVG_REFRESH}</span><span>Live · tersinkron <b>${fmtDT(state.lastSync)}</b> · otomatis tiap 2 menit</span>`; }
  else if(state.lastSync){ live.className='live warn'; live.innerHTML=`<span class="ico">${SVG_REFRESH}</span><span>Sebagian belum termuat (<b>${esc(state.failed.join(', '))}</b>) · terakhir tersinkron ${fmtDT(state.lastSync)}</span>`; }
  else { live.className='live warn'; live.innerHTML=`<span class="ico">${SVG_REFRESH}</span><span>Offline · memakai data salinan${latest?' per <b>'+esc(latest)+'</b>':''} · otomatis coba lagi tiap 2 menit</span>`; }
  for(const t of ['stnk','bpkb']){ $('tab-'+t).setAttribute('aria-selected',String(state.tab===t)); $('n-'+t).textContent=fmtN(rowsOf(t).length); }
}
function renderSummary(rows){
  const tab=state.tab, st=state[tab], ages=rows.map(r=>r.age).filter(a=>a!=null);
  const avg=ages.length? Math.round(ages.reduce((a,b)=>a+b,0)/ages.length):0, max=ages.length? Math.max(...ages):0;
  const ncab=new Set(rows.map(r=>r.cab)).size;
  const base=filtered('age'), m=countBy(base,'age'), tot=base.length;
  const hero=`<div class="hero"><div class="l">Total ${tab.toUpperCase()} belum siap — ${st.f.cab? esc(st.f.cab) : ncab+' cabang'}</div><div class="big">${rows.length? rows.length.toLocaleString('id-ID'):'-'}</div><div class="s">dari <b>${fmtN(rows.length)}</b> unit &nbsp;·&nbsp; rata-rata umur <b>${fmtN(avg)}</b> hari &nbsp;·&nbsp; terlama <b>${fmtN(max)}</b> hari</div></div>`;
  const tiles=BUCKETS.map((b,i)=>{ const c=m.get(b.k)||0, pct=tot? Math.round(c/tot*100):0;
    return `<button class="bt ${i===3?'crit':''} ${st.f.age===b.k?'on':''}" data-b="${b.k}"><div class="h"><span class="d" style="background:var(${b.dot})"></span>${b.l}</div><div class="v">${c? c.toLocaleString('id-ID')+' unit':'-'}</div><div class="c">${c? pct+'% dari total':'-'}${i===3&&c?' · prioritas tindak lanjut':''}</div></button>`; }).join('');
  $('sum').innerHTML = hero+`<div class="bk">${tiles}</div>`;
}
function renderCabTabs(){
  const tab=state.tab, sel=state[tab].f.cab, all=rowsOf(tab);
  const pill=(v,label,n)=>`<button class="pill" role="tab" data-c="${esc(v)}" aria-selected="${sel===v}">${esc(label)} <span class="n">${fmtN(n)}</span></button>`;
  $('cabtabs').innerHTML = pill('','Semua Cabang',all.length)+CABTAB.map(c=>pill(c,c,all.filter(r=>r.cab===c).length)).join('');
}
function renderPanels(){
  const st=state[state.tab], all=rowsOf(state.tab);
  $('panels').innerHTML = PANELS.map(([k,title,allLabel])=>{
    const sub=filtered(k), m=countBy(sub,k);
    const keys = k==='cab'? CABS.slice() : k==='biro'? [...new Set(SOURCES.flatMap(s=>s.rows.map(r=>r.biro)).filter(Boolean))] : [...new Set(all.map(r=>fval(r,k)||'(Kosong)'))];
    if(k!=='cab') keys.sort((a,b)=>(m.get(b)||0)-(m.get(a)||0)||a.localeCompare(b));
    const max=Math.max(1,...keys.map(v=>m.get(v)||0));
    const btn=(v,label,c,bar,cls)=>`<button class="row ${cls||''} ${(st.f[k]||'')===v?'on':''}" data-k="${k}" data-v="${esc(v)}" title="${esc(label)}: ${c} unit"><span class="t"><span class="nm">${esc(label)}</span>${bar?`<span class="bar" style="width:${bar}%"></span>`:''}</span><span class="c">${fmtN(c)}</span></button>`;
    return `<div class="panel"><h3>${title}</h3><div class="bl">`+btn('',allLabel,sub.length,0,'all')+keys.map(v=>btn(v,v,m.get(v)||0,(m.get(v)||0)/max*100)).join('')+`</div></div>`;
  }).join('');
}
function renderFilters(){
  const st=state[state.tab], all=rowsOf(state.tab);
  const opts=k=>{ if(k==='age') return BUCKETS.map(b=>[b.k,b.l]); if(k==='cab') return CABS.map(c=>[c,c]); const s=[...new Set(all.map(r=>fval(r,k)||'(Kosong)'))].sort((a,b)=>a.localeCompare(b)); return s.map(v=>[v,v]); };
  const active=document.activeElement && document.activeElement.id==='q';
  $('filters').innerHTML = `<input id="q" type="search" placeholder="Cari nama, no polisi, no rangka, salesman..." value="${esc(st.f.q)}">`+
    FILTERS.map(([k,lab])=>`<select data-f="${k}"><option value="">${lab}</option>${opts(k).map(([v,l])=>`<option value="${esc(v)}" ${st.f[k]===v?'selected':''}>${esc(l)}</option>`).join('')}</select>`).join('')+
    `<button class="btn" id="reset">Reset</button><span class="spacer"></span><button class="btn pri" id="xls">Export Excel</button><button class="btn" id="pdf">Export PDF</button>`;
  if(active){ const q=$('q'); q.focus(); q.setSelectionRange(q.value.length,q.value.length); }
}
function sortedRows(rows){
  const st=state[state.tab], {key,dir}=st.sort;
  const num = key==='age'||key==='no', dateKey=['mohon','terima','serah'].includes(key);
  const val = r => num? (r[key]===null||r[key]===''?-1:+r[key]) : dateKey? (pd(r[key])?.getTime()??0) : String(r[key]??'').toLowerCase();
  return rows.slice().sort((a,b)=>{ const x=val(a),y=val(b); return (x<y?-1:x>y?1:0)*dir; });
}
function cell(r,key,cls){
  let v=r[key];
  if(key==='age'){ if(v==null) return `<td class="num"><span class="dash">-</span></td>`; return `<td class="num"><span class="badge ${bucketOf(v).c}">${fmtN(v)}</span></td>`; }
  if(key==='no') v=r._n;
  if(v===''||v==null) return `<td class="${cls||''}"><span class="dash">-</span></td>`;
  return `<td class="${cls||''}">${esc(v)}</td>`;
}
function renderTable(rows){
  const cfg=TABS[state.tab], st=state[state.tab];
  const head='<thead><tr>'+cfg.cols.map(([k,l,c])=>`<th class="${c==='num'?'num':''}" data-s="${k}">${esc(l)}${st.sort.key===k?`<span class="ar">${st.sort.dir>0?'▲':'▼'}</span>`:''}</th>`).join('')+'</tr></thead>';
  const srt=sortedRows(rows); srt.forEach((r,i)=>r._n=i+1);
  const body = srt.length? srt.map(r=>'<tr>'+cfg.cols.map(([k,,c])=>cell(r,k,c)).join('')+'</tr>').join('') : `<tr><td colspan="${cfg.cols.length}" class="empty">Tidak ada data yang sesuai filter</td></tr>`;
  $('tbl').innerHTML=head+'<tbody>'+body+'</tbody>';
  $('cnt').textContent=`Menampilkan ${fmtN(rows.length)} dari ${fmtN(rowsOf(state.tab).length)} unit`;
}
function exportRows(){
  const cfg=TABS[state.tab]; const rows=sortedRows(filtered()); rows.forEach((r,i)=>r._n=i+1);
  return {heads:cfg.cols.map(c=>c[1]), data:rows.map(r=>cfg.cols.map(([k])=>{ const v=k==='no'?r._n:r[k]; return (v===null||v===undefined)?'':(k==='age'||k==='no')&&v!==''?+v:v; }))};
}
function downloadBlob(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); }
function exportExcel(){
  const {heads,data}=exportRows(); const stamp=TODAY.toISOString().slice(0,10); const name=`${TABS[state.tab].title.replace(/ /g,'_')}_Semua_Cabang_${stamp}`;
  const csvFallback=()=>{ const q=v=>`"${String(v).replace(/"/g,'""')}"`; downloadBlob(new Blob(['﻿'+[heads,...data].map(r=>r.map(q).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}),name+'.csv'); };
  const go=()=>{ try{ const ws=XLSX.utils.aoa_to_sheet([heads,...data]); ws['!cols']=heads.map((h,i)=>({wch:Math.min(40,Math.max(h.length,...data.map(r=>String(r[i]).length))+2)})); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,TABS[state.tab].title.slice(0,31)); XLSX.writeFile(wb,name+'.xlsx'); }catch(e){ csvFallback(); } };
  if(window.XLSX) return go();
  const s=document.createElement('script'); s.src='https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js'; s.onload=go; s.onerror=csvFallback; document.head.appendChild(s);
}
function render(){
  renderHead(); const rows=filtered(); renderCabTabs(); renderSummary(rows); renderPanels(); renderFilters(); renderTable(rows);
}
document.addEventListener('click',e=>{
  const st=state[state.tab];
  const tb=e.target.closest('.tab'); if(tb){ state.tab=tb.id.replace('tab-',''); render(); return; }
  const pl=e.target.closest('.pill'); if(pl){ st.f.cab=pl.dataset.c; render(); return; }
  const bt=e.target.closest('.bt'); if(bt){ const v=bt.dataset.b; st.f.age=st.f.age===v?'':v; render(); return; }
  const row=e.target.closest('.row'); if(row){ const k=row.dataset.k, v=row.dataset.v; st.f[k]=st.f[k]===v?'':v; render(); return; }
  const th=e.target.closest('th[data-s]'); if(th){ const k=th.dataset.s; st.sort = st.sort.key===k? {key:k,dir:-st.sort.dir}:{key:k,dir:(k==='age'?-1:1)}; renderTable(filtered()); return; }
  if(e.target.closest('#refresh')) { loadAll(); return; }
  if(e.target.id==='reset'){ const c=st.f.cab; st.f=emptyF(); st.f.cab=c; render(); }
  if(e.target.id==='xls') exportExcel();
  if(e.target.id==='pdf') window.print();
});
document.addEventListener('change',e=>{ if(e.target.dataset.f){ state[state.tab].f[e.target.dataset.f]=e.target.value; render(); } });
document.addEventListener('input',e=>{ if(e.target.id==='q'){ state[state.tab].f.q=e.target.value; const rows=filtered(); renderSummary(rows); renderPanels(); renderTable(rows); } });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && (!state.lastSync || Date.now()-state.lastSync>REFRESH_MS)) loadAll(); });

prep(); render();
loadAll();
setInterval(()=>{ if(!document.hidden) loadAll(); }, REFRESH_MS);
</script>
</body>
